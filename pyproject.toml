
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timanstat"
version = "0.1.0"
description = "A modular statistical support platform by Timan Analytics for research, development organisations, and businesses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "scipy>=1.13,<2",
    "cryptography>=42,<47",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.40,<2",
]

desktop = [
    "PySide6>=6.7,<7",
]

postgres = [
    "psycopg[binary]>=3.2,<4",
]

dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["timan_intelligence*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
