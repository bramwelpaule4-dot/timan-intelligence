name: TimanStat Tests

on:
  push:
    branches:
      - main
      - development/timanstat-phase-1

  pull_request:
    branches:
      - main
      - development/timanstat-phase-1

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,web]"

      - name: Verify package installation
        run: |
          python -c "import timan_intelligence; print('TimanStat shared package import successful')"

      - name: Run automated tests
        run: |
          python -m pytest -q \
            --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
          retention-days: 14

  postgresql-integration:
    name: PostgreSQL 16 Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timanstat
          POSTGRES_PASSWORD: timanstat_test_password
          POSTGRES_DB: timanstat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timanstat -d timanstat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TIMANSTAT_TEST_POSTGRES_URL: postgresql://timanstat:timanstat_test_password@localhost:5432/timanstat_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,web,postgres]"

      - name: Verify PostgreSQL driver
        run: |
          python -c "import psycopg; print('PostgreSQL driver available:', psycopg.__version__)"

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest -q tests/test_postgresql_integration.py \
            --junitxml=postgresql-test-results.xml

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-integration-test-results
          path: postgresql-test-results.xml
          if-no-files-found: ignore
          retention-days: 14
